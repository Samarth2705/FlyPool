# Render Blueprint for the FlyPool API (server/).
# Render -> New -> Blueprint -> pick this repository. Render reads this file,
# creates the web service and asks for the values marked "sync: false".
# No secrets are stored here: JWT_SECRET is generated by Render, and
# MONGODB_URI / CLIENT_ORIGIN are typed into the Render dashboard.
services:
  - type: web
    name: flypool-api
    runtime: node
    plan: free
    region: singapore # closest Render region to Mumbai
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Atlas connection string - entered in the Render dashboard
      - key: MONGODB_URI
        sync: false
      # Random secret generated by Render (never in Git)
      - key: JWT_SECRET
        generateValue: true
      # The Vercel URL of the app, e.g. https://flypool.vercel.app
      - key: CLIENT_ORIGIN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      # The app calls the API through Vercel (client/vercel.json), so the
      # login cookie is first-party and "lax" works
      - key: COOKIE_SAME_SITE
        value: lax
      # Requests pass through Vercel's proxy and Render's load balancer
      - key: TRUST_PROXY
        value: "2"
      # Pilot: consistency checks only, labelled "demo verification" in the app
      - key: FLIGHT_VERIFICATION_MODE
        value: demo
